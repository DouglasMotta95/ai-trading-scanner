<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Trading Scanner • Administração</title><link rel="stylesheet" href="admin.css"></head><body><main><header><div><small>AI TRADING SCANNER</small><h1>Painel Administrativo</h1><p>Configuração local da extensão e do motor de análise.</p></div><div class="status"><i></i> SISTEMA LOCAL</div></header><section class="grid"><article><h2>Scanner</h2><label>Perfil<select id="profile"><option value="conservative">Conservador</option><option value="balanced">Balanceado</option><option value="aggressive">Agressivo</option></select></label><label>Score mínimo<input id="minScore" type="range" min="50" max="95"><span id="scoreValue"></span></label><label class="toggle"><span>Som nos alertas</span><input id="sound" type="checkbox"></label><label class="toggle"><span>Somente setups A+</span><input id="onlyA" type="checkbox"></label></article><article><h2>Mercado</h2><label>Timeframe preferido<select id="timeframe"><option>M1</option><option>M5</option><option>M15</option></select></label><label class="toggle"><span>Bloquear feed desatualizado</span><input id="staleBlock" type="checkbox"></label><label class="toggle"><span>Filtro de volatilidade</span><input id="volatility" type="checkbox"></label><label class="toggle"><span>Filtro multi-timeframe</span><input id="mtf" type="checkbox"></label></article><article><h2>Inteligência</h2><label class="toggle"><span>Motor quantitativo</span><input id="quant" type="checkbox"></label><label class="toggle"><span>Camada IA</span><input id="ai" type="checkbox"></label><p class="note">A IA será integrada por backend; nenhuma chave será salva dentro da extensão.</p></article><article><h2>Diagnóstico</h2><div id="diag" class="diag">Aguardando CasaTrade...</div><button id="copyDiag">COPIAR DIAGNÓSTICO</button></article></section><div class="savebar"><span id="saved">Configurações locais</span><button id="save">SALVAR ALTERAÇÕES</button></div></main><script src="admin.js"></script></body></html>
