name: Cleanup runtime build artifacts

on:
  push:
    branches: [fix/connect-casatrade-any-open-tab]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Remove temporary build outputs
        run: |
          rm -rf build-extension
          rm -f AI-Trading-Scanner-0.10.4-RUNTIME-RECOVERY.zip
      - name: Full tests
        run: cd backend && npm test
      - name: Commit clean source-only branch
        run: |
          rm -f .github/workflows/cleanup-runtime-build-artifacts.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: keep runtime recovery branch source-only'
          git push origin HEAD:fix/connect-casatrade-any-open-tab
