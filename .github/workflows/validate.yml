name: Validate extension
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate manifest
        run: node -e "const m=JSON.parse(require('fs').readFileSync('manifest.json','utf8')); if(m.manifest_version!==3) process.exit(1); if(m.action?.default_popup) process.exit(2); if(m.side_panel?.default_path!=='src/sidepanel/index.html') process.exit(3); console.log('manifest',m.version,'side-panel-only ok')"
      - name: Check required extension files
        run: test -f src/background.js && test -f src/background-augment.js && test -f src/background-ai-analysis.js && test -f src/core/orchestrator.js && test -f src/core/analysis.js && test -f src/core/candles.js && test -f src/services/license.js && test -f src/services/ai-analysis.js && test -f src/content/network-probe.js && test -f src/content/network-bridge.js && test -f src/content/generic-adapter.js && test -f src/content/platform-sync.js && test -f src/content/trade-handoff.js && test -f src/platforms/registry.js && test -f src/sidepanel/index.html && test -f src/sidepanel/app.js && test -f src/sidepanel/ai-analysis-ui.js && test -f src/sidepanel/account-login.js && test ! -e src/core/ai-scoring.js && test ! -e src/core/backtest.js && test ! -e src/core/correlation.js && test ! -e src/core/market-structure.js && test ! -e src/core/reporting.js && test ! -e src/content/chart-overlay.js && test ! -e src/content/history-adapter.js && test ! -e src/background-platform-sync.js
      - name: Check Gemini gateway files
        run: test -f backend-ai/package.json && test -f backend-ai/src/server.js
      - name: Syntax check extension
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Syntax check backend
        run: find backend -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Syntax check Gemini gateway
        run: find backend-ai -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Syntax check admin dashboard
        run: find apps/admin-dashboard -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Syntax check customer portal
        run: find apps/customer-portal -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Core unit tests
        run: cd backend && npm test
      - name: Prepare extension package
        if: always()
        run: |
          rm -rf dist/ai-trading-scanner-extension
          mkdir -p dist/ai-trading-scanner-extension
          cp manifest.json dist/ai-trading-scanner-extension/manifest.json
          cp -R src dist/ai-trading-scanner-extension/src
      - name: Upload extension test package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-trading-scanner-extension-demo
          path: dist/ai-trading-scanner-extension/
          if-no-files-found: error
          retention-days: 30
