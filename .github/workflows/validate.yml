name: Validate extension
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate manifest
        run: node -e "const m=JSON.parse(require('fs').readFileSync('manifest.json','utf8')); if(m.manifest_version!==3) process.exit(1); if(m.action?.default_popup) process.exit(2); if(m.side_panel?.default_path!=='src/sidepanel/index.html') process.exit(3); console.log('manifest',m.version,'side-panel-only ok')"
      - name: Check required extension files
        run: test -f src/background.js && test -f src/background-platform-sync.js && test -f src/core/orchestrator.js && test -f src/services/license.js && test -f src/content/network-probe.js && test -f src/content/network-bridge.js && test -f src/content/generic-adapter.js && test -f src/content/platform-sync.js && test -f src/content/history-adapter.js && test -f src/content/trade-handoff.js && test -f src/platforms/registry.js && test -f src/platforms/base-adapter.js && test -f src/sidepanel/index.html && test -f src/sidepanel/app.js && test -f src/sidepanel/account-login.js && test -f src/sidepanel/experience.js && test ! -e src/sidepanel/preflight.js && test -f src/admin/index.html && test -f apps/admin-dashboard/index.html && test -f apps/admin-dashboard/app.js && test -f apps/customer-portal/index.html && test -f apps/customer-portal/app.js && test -f backend/src/server.js && test ! -e backend/src/server-v08.js && test ! -e backend/src/server-v09.js && test ! -e src/popup/index.html
      - name: Syntax check extension
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Syntax check backend
        run: find backend -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Syntax check admin dashboard
        run: find apps/admin-dashboard -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Syntax check customer portal
        run: find apps/customer-portal -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Core unit tests
        run: cd backend && npm test
