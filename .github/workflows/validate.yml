name: Validate extension
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate manifest and referenced assets
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const m = JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const fail = msg => { throw new Error(msg); };
          if (m.manifest_version !== 3) fail('manifest must be v3');
          if (m.action?.default_popup) fail('popup mode is not allowed; side panel is authoritative');
          if (m.side_panel?.default_path !== 'src/sidepanel/index.html') fail('unexpected side panel path');
          if (m.background?.type !== 'module') fail('background service worker must be a module');
          const requiredPermissions = ['storage','activeTab','scripting','sidePanel'];
          for (const permission of requiredPermissions) if (!m.permissions?.includes(permission)) fail(`missing permission: ${permission}`);
          const requiredHosts = ['casatrade.com','casatraders.online','ivcasatraders.online'];
          const hosts = (m.host_permissions || []).join('\n');
          for (const host of requiredHosts) if (!hosts.includes(host)) fail(`missing host permission: ${host}`);
          const referenced = new Set([
            m.background?.service_worker,
            m.side_panel?.default_path,
            m.options_page,
            ...(m.content_scripts || []).flatMap(entry => entry.js || []),
            ...(m.content_scripts || []).flatMap(entry => entry.css || [])
          ].filter(Boolean));
          for (const file of referenced) if (!fs.existsSync(file)) fail(`manifest references missing file: ${file}`);
          for (const entry of m.content_scripts || []) {
            if (!Array.isArray(entry.matches) || !entry.matches.length) fail('content script without matches');
            if (entry.world === 'MAIN' && entry.run_at !== 'document_start') fail('MAIN-world probes must start at document_start');
          }
          for (const html of [m.side_panel?.default_path, m.options_page].filter(Boolean)) {
            const text = fs.readFileSync(html, 'utf8');
            const refs = [...text.matchAll(/(?:src|href)=["']([^"'#?]+)["']/g)].map(x => x[1]);
            for (const ref of refs) {
              if (/^(?:https?:|data:|chrome-extension:)/i.test(ref)) continue;
              const resolved = path.normalize(path.join(path.dirname(html), ref));
              if (!fs.existsSync(resolved)) fail(`${html} references missing asset: ${ref}`);
            }
          }
          console.log('manifest', m.version, 'and referenced assets ok');
          NODE
      - name: Check required extension files
        run: test -f src/background.js && test -f src/background-entry.js && test -f src/background-augment.js && test -f src/core/orchestrator.js && test -f src/core/analysis.js && test -f src/core/candles.js && test -f src/services/license.js && test -f src/services/scanner-state-atomic.js && test -f src/content/focused-asset.js && test -f src/content/worker-probe.js && test -f src/content/canvas-probe.js && test -f src/content/network-probe.js && test -f src/content/network-bridge.js && test -f src/content/embedded-feed-bridge.js && test -f src/content/generic-adapter.js && test -f src/content/platform-sync.js && test -f src/content/trade-handoff.js && test -f src/platforms/registry.js && test -f src/sidepanel/index.html && test -f src/sidepanel/app.js && test -f src/sidepanel/account-login.js && test ! -e src/core/ai-scoring.js && test ! -e src/core/backtest.js && test ! -e src/core/correlation.js && test ! -e src/core/market-structure.js && test ! -e src/core/reporting.js && test ! -e src/content/chart-overlay.js && test ! -e src/content/history-adapter.js && test ! -e src/background-platform-sync.js
      - name: Syntax check extension
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Syntax check backend
        run: find backend -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Syntax check admin dashboard
        run: find apps/admin-dashboard -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Syntax check customer portal
        run: find apps/customer-portal -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Detect unresolved merge markers
        run: |
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' --exclude-dir=.git --exclude='*.lock' .; then
            echo 'Unresolved merge marker found'
            exit 1
          fi
      - name: Core unit tests
        run: cd backend && npm test
