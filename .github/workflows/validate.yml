name: Validate extension
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate manifest
        run: node -e "const m=JSON.parse(require('fs').readFileSync('manifest.json','utf8')); if(m.manifest_version!==3) process.exit(1); console.log('manifest',m.version,'ok')"
      - name: Check required extension files
        run: test -f src/background.js && test -f src/core/orchestrator.js && test -f src/services/license.js && test -f src/content/network-probe.js && test -f src/content/network-bridge.js && test -f src/content/generic-adapter.js && test -f src/content/trade-handoff.js && test -f src/platforms/registry.js && test -f src/platforms/base-adapter.js && test -f src/sidepanel/index.html && test -f src/sidepanel/app.js && test -f src/admin/index.html && test -f apps/admin-dashboard/index.html && test -f apps/admin-dashboard/app.js
      - name: Syntax check extension
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Syntax check backend
        run: find backend -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Syntax check admin dashboard
        run: find apps/admin-dashboard -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Core unit tests
        run: cd backend && npm test
