name: Export PR29 exact ZIP

on:
  push:
    branches:
      - artifact/pr29-8f038475

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact commit archive
        shell: bash
        run: |
          set -euo pipefail
          TARGET=8f038475b5db815bcce1aad579b85fd6adc50a67
          git cat-file -e "$TARGET^{commit}"
          git archive --format=zip --output=ai-trading-scanner-PR29-8f038475.zip --prefix=ai-trading-scanner-8f038475/ "$TARGET"
          sha256sum ai-trading-scanner-PR29-8f038475.zip > ai-trading-scanner-PR29-8f038475.zip.sha256
          unzip -t ai-trading-scanner-PR29-8f038475.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ai-trading-scanner-PR29-8f038475
          path: |
            ai-trading-scanner-PR29-8f038475.zip
            ai-trading-scanner-PR29-8f038475.zip.sha256
          if-no-files-found: error
          retention-days: 1
