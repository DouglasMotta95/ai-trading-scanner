name: Wire exact demo outcomes

on:
  push:
    branches:
      - release/demo-candidate-integrated-v3

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python3 .github/scripts/wire-demo-outcomes.py
      - name: Validate
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          cd backend
          npm test
          cd ..
      - name: Commit functional changes and clean helpers
        run: |
          rm -f .github/workflows/wire-demo-outcomes.yml .github/scripts/wire-demo-outcomes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire exact demo signal outcomes"
          git push origin HEAD:release/demo-candidate-integrated-v3
