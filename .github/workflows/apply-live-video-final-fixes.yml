name: Apply final live-video fixes

on:
  push:
    branches:
      - release/demo-candidate-integrated-v3

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply targeted fixes
        run: python3 .github/scripts/apply-live-video-final-fixes.py
      - name: Correct regression scope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/live-video-asset-switch.test.mjs')
          s = p.read_text()
          s = s.replace(
            "  assert.doesNotMatch(focused, /userSelection = null/);",
            "  const chooseCandidate = focused.match(/function chooseCandidate\\(\\) \\{[\\s\\S]*?function publish/)?.[0] || '';\n  assert.doesNotMatch(chooseCandidate, /userSelection = null/);"
          )
          p.write_text(s)
          PY
      - name: Syntax check
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Full test suite
        run: |
          cd backend
          npm test
          cd ..
      - name: Commit only functional changes
        run: |
          rm -f .github/scripts/apply-live-video-final-fixes.py .github/workflows/apply-live-video-final-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: prevent stale asset state after CasaTrade switch"
          git push origin HEAD:release/demo-candidate-integrated-v3
