name: Retry market regime phase 1

on:
  push:
    branches:
      - feat/market-regime-confirmation-gate

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply gate with corrected regression fixture
        shell: bash
        run: |
          set -euo pipefail
          awk '/^          python3 - <<'"'"'PY'"'"'$/ {capture=1; next} capture && /^          PY$/ {exit} capture {sub(/^          /, ""); print}' .github/workflows/apply-market-regime-phase1.yml > /tmp/market_regime_patch.py
          python3 /tmp/market_regime_patch.py
          TEST_B64=''
          printf '%s' "$TEST_B64" | base64 -d > test/market-regime-gate.test.mjs
          node --check src/core/orchestrator.js
          node --check src/core/market-regime.js
          node --check test/market-regime-gate.test.mjs
          cd backend
          npm test
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/orchestrator.js test/market-regime-gate.test.mjs
          git commit -m "feat: gate confirmations in range regime"
          git push origin HEAD:feat/market-regime-confirmation-gate
