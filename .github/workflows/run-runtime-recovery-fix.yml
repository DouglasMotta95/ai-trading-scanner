name: Run runtime recovery patch

on:
  push:
    branches:
      - fix/connect-casatrade-any-open-tab

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: |
          python scripts/apply-runtime-recovery-fix.py
          python scripts/post-runtime-recovery-fix.py
      - name: Syntax checks
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          find backend -name '*.js' -print0 | xargs -0 -n1 node --check
          find apps -name '*.js' -print0 | xargs -0 -n1 node --check
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
      - name: Full tests
        run: cd backend && npm test
      - name: Build extension ZIP
        run: |
          rm -rf build-extension
          mkdir build-extension
          cp manifest.json build-extension/manifest.json
          cp -R src build-extension/src
          cd build-extension
          zip -qr ../AI-Trading-Scanner-0.10.4-RUNTIME-RECOVERY.zip manifest.json src
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Trading-Scanner-0.10.4-RUNTIME-RECOVERY
          path: AI-Trading-Scanner-0.10.4-RUNTIME-RECOVERY.zip
          if-no-files-found: error
          retention-days: 30
      - name: Commit validated patch
        run: |
          rm scripts/apply-runtime-recovery-fix.py
          rm scripts/post-runtime-recovery-fix.py
          rm .github/workflows/run-runtime-recovery-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: recover CasaTrade runtime, feed quality and stable device identity'
          git push origin HEAD:fix/connect-casatrade-any-open-tab
