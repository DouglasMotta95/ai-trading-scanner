name: Apply signal and overlay live fix

on:
  push:
    branches:
      - release/demo-candidate-integrated-v3

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply targeted fixes
        run: python3 .github/scripts/apply-signal-overlay-live-fix.py
      - name: Syntax check extension
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run full suite
        run: |
          cd backend
          npm test
          cd ..
      - name: Commit functional changes and remove temporary helpers
        run: |
          rm -f .github/scripts/apply-signal-overlay-live-fix.py .github/workflows/apply-signal-overlay-live-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make live signal gating and analysis overlay actionable"
          git push origin HEAD:release/demo-candidate-integrated-v3
