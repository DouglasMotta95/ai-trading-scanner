name: Apply market regime phase 1

on:
  push:
    branches:
      - feat/market-regime-confirmation-gate

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Connect range regime gate and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/core/orchestrator.js')
          s = p.read_text()
          old = "import { analyzeCandles, ANALYST_THRESHOLDS } from './analysis.js';\n"
          new = old + "import { marketRegime } from './market-regime.js';\n"
          if old not in s or "from './market-regime.js'" in s:
              raise SystemExit('orchestrator import anchor missing or already patched')
          s = s.replace(old, new, 1)

          old = "  uiState = 'ANALYZING_MARKET', analytics = {}, stability = null\n} = {}) {"
          new = "  uiState = 'ANALYZING_MARKET', analytics = {}, stability = null, regime = null\n} = {}) {"
          if old not in s:
              raise SystemExit('baseSignal args anchor missing')
          s = s.replace(old, new, 1)

          old = "    analytics,\n    stability,\n    targetStart,"
          new = "    analytics,\n    regime,\n    stability,\n    targetStart,"
          if old not in s:
              raise SystemExit('baseSignal return anchor missing')
          s = s.replace(old, new, 1)

          old = "  const liveResult = analyzeCandles(combined, indicatorHistory);\n  const candleCount = closed.length;\n"
          new = "  const liveResult = analyzeCandles(combined, indicatorHistory);\n  const regime = marketRegime(closed);\n  const candleCount = closed.length;\n"
          if old not in s:
              raise SystemExit('regime calculation anchor missing')
          s = s.replace(old, new, 1)

          old = "    analytics: liveResult.analytics || {},\n    stability: stabilitySnapshot(tracker),"
          new = "    analytics: liveResult.analytics || {},\n    regime,\n    stability: stabilitySnapshot(tracker),"
          if old not in s:
              raise SystemExit('common signal anchor missing')
          s = s.replace(old, new, 1)

          old = "  if (secondsRemaining <= 10) {\n    const canConfirm = observeConfirmation(tracker, liveResult, direction, score, sampleAt);\n    if (canConfirm) {"
          new = "  if (secondsRemaining <= 10) {\n    const rangeBlocked = regime?.type === 'range';\n    if (rangeBlocked) {\n      tracker.confirmDirection = null;\n      tracker.confirmHits = 0;\n      tracker.lastConfirmAt = null;\n    }\n    const canConfirm = !rangeBlocked && observeConfirmation(tracker, liveResult, direction, score, sampleAt);\n    if (canConfirm) {"
          if old not in s:
              raise SystemExit('confirmation gate anchor missing')
          s = s.replace(old, new, 1)

          old = "    finalDecisions.set(key, {\n      bucket: currentBucket,\n      state: 'NO_TRADE',\n      direction: null,\n      provisional: false,\n      reason: 'Sem confirmação estável suficiente para liberar a próxima vela.',\n      score,\n      targetStart,\n      asset: snapshot.asset,\n      timeframe: analysisTimeframe\n    });\n\n    if (possibleDirection) {"
          new = "    const noTradeReason = rangeBlocked\n      ? 'AGUARDANDO — mercado sem tendência definida.'\n      : 'Sem confirmação estável suficiente para liberar a próxima vela.';\n    finalDecisions.set(key, {\n      bucket: currentBucket,\n      state: 'NO_TRADE',\n      direction: null,\n      provisional: false,\n      reason: noTradeReason,\n      score,\n      targetStart,\n      asset: snapshot.asset,\n      timeframe: analysisTimeframe\n    });\n\n    if (rangeBlocked) {\n      return {\n        candles: closed,\n        currentCandle: current,\n        lastConfirmed,\n        signal: baseSignal({\n          ...common,\n          state: 'NO_TRADE',\n          direction: null,\n          provisional: false,\n          phase: 'FINAL',\n          uiState: 'WAIT',\n          reason: noTradeReason,\n          stability: stabilitySnapshot(tracker)\n        })\n      };\n    }\n\n    if (possibleDirection) {"
          if old not in s:
              raise SystemExit('no-trade range return anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          test_file = Path('test/market-regime-gate.test.mjs')
          test_file.write_text(r'''import test from 'node:test';
import assert from 'node:assert/strict';
import { marketRegime } from '../src/core/market-regime.js';
import { processSnapshot, resetOrchestrator } from '../src/core/orchestrator.js';

const minute = 60_000;

function rangeWithStrongCurrent(bucket) {
  const candles = [];
  for (let i = 20; i >= 1; i--) {
    const index = 20 - i;
    const base = 1.1000 + (index % 2 === 0 ? -0.0020 : 0.0020);
    const close = base + (index % 3 === 0 ? 0.0015 : -0.0010);
    candles.push({
      time: bucket - i * minute,
      open: base,
      high: Math.max(base, close) + 0.0040,
      low: Math.min(base, close) - 0.0040,
      close,
      timeframe: 'M1'
    });
  }
  candles.push({
    time: bucket,
    open: 1.0990,
    high: 1.1125,
    low: 1.0985,
    close: 1.1115,
    timeframe: 'M1'
  });
  return candles;
}

function snapshot(bucket, offset, candles) {
  return {
    platformId: 'casatrade',
    asset: 'EUR/USD',
    price: 1.1115,
    timeframe: 'M1',
    analysisTimeframe: 'M1',
    connection: 'online',
    serverTime: bucket + offset,
    candles
  };
}

test('market regime classifies the fixture as range', () => {
  const bucket = Math.floor(1_800_100_000_000 / minute) * minute;
  const candles = rangeWithStrongCurrent(bucket);
  const regime = marketRegime(candles.slice(0, -1));
  assert.equal(regime.type, 'range');
});

test('range regime blocks ENTER even after confirmation score and stability are otherwise sufficient', () => {
  resetOrchestrator();
  const bucket = Math.floor(1_800_110_000_000 / minute) * minute;
  const candles = rangeWithStrongCurrent(bucket);

  processSnapshot(snapshot(bucket, 35_000, candles), { connection: 'online' });
  processSnapshot(snapshot(bucket, 36_000, candles), { connection: 'online' });
  const firstFinal = processSnapshot(snapshot(bucket, 51_000, candles), { connection: 'online' });
  const blocked = processSnapshot(snapshot(bucket, 52_000, candles), { connection: 'online' });

  assert.equal(blocked.signal.regime?.type, 'range');
  assert.ok(Number(blocked.signal.analysisScore) >= 58, `expected score >= 58, got ${blocked.signal.analysisScore}`);
  assert.notEqual(firstFinal.signal.uiState, 'ENTER_BUY');
  assert.notEqual(firstFinal.signal.uiState, 'ENTER_SELL');
  assert.equal(blocked.signal.state, 'NO_TRADE');
  assert.equal(blocked.signal.uiState, 'WAIT');
  assert.equal(blocked.signal.direction, null);
  assert.equal(blocked.signal.reason, 'AGUARDANDO — mercado sem tendência definida.');
});

test('regime gate is additive and does not change approved thresholds', async () => {
  const { ANALYST_THRESHOLDS } = await import('../src/core/analysis.js');
  assert.equal(ANALYST_THRESHOLDS.possibleScore, 44);
  assert.equal(ANALYST_THRESHOLDS.confirmScore, 58);
  assert.equal(ANALYST_THRESHOLDS.candleStrength, 62);
  assert.equal(ANALYST_THRESHOLDS.rejectionStrength, 50);
});
''')
          PY
          node --check src/core/orchestrator.js
          node --check src/core/market-regime.js
          node --check test/market-regime-gate.test.mjs
          cd backend
          npm test
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/orchestrator.js test/market-regime-gate.test.mjs
          git commit -m "feat: gate confirmations in range regime"
          git push origin HEAD:feat/market-regime-confirmation-gate
