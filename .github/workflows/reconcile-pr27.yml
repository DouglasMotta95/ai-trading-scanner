name: Reconcile PR27 against atomic main

on:
  push:
    branches:
      - fix/focus-gate-fallback-flow

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild PR27 on atomic main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          mkdir -p /tmp/pr27
          cp scripts/reconcile-pr27-state.py /tmp/reconcile-pr27-state.py
          cp scripts/pr27-reconcile-contract-tests.py /tmp/pr27-reconcile-contract-tests.py
          cp .github/workflows/reconcile-pr27.yml /tmp/reconcile-pr27.yml

          FILES=(
            src/content/focused-asset.js
            src/content/generic-adapter.js
            src/core/market-evidence.js
            src/core/orchestrator.js
            src/sidepanel/app.js
            test/extension-commercial.test.mjs
            test/focus-fallback-flow.test.mjs
            test/product-surfaces.test.mjs
          )
          for f in "${FILES[@]}"; do
            mkdir -p "/tmp/pr27/$(dirname "$f")"
            cp "$f" "/tmp/pr27/$f"
          done

          git reset --hard origin/main

          for f in "${FILES[@]}"; do
            mkdir -p "$(dirname "$f")"
            cp "/tmp/pr27/$f" "$f"
          done
          mkdir -p .github/workflows
          cp /tmp/reconcile-pr27.yml .github/workflows/reconcile-pr27.yml

          python3 /tmp/reconcile-pr27-state.py
          python3 /tmp/pr27-reconcile-contract-tests.py

          test -f src/services/scanner-state-atomic.js
          test -f test/scanner-state-writer-audit.test.mjs
          ! grep -R --include='*.js' -nE 'chrome\.storage\.local\.set\s*\(\s*\{\s*scannerState\b' src --exclude='scanner-state-atomic.js'

          node -e "const m=JSON.parse(require('fs').readFileSync('manifest.json','utf8')); if(m.manifest_version!==3) process.exit(1); if(m.action?.default_popup) process.exit(2); if(m.side_panel?.default_path!=='src/sidepanel/index.html') process.exit(3); console.log('manifest',m.version,'side-panel-only ok')"
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          find backend -name '*.js' -print0 | xargs -0 -n1 node --check
          find apps/admin-dashboard -name '*.js' -print0 | xargs -0 -n1 node --check
          find apps/customer-portal -name '*.js' -print0 | xargs -0 -n1 node --check
          cd backend && npm test
          cd ..

          git add -A
          git commit -m "reconcile: rebuild PR27 on atomic scanner state main"
          git push --force-with-lease origin HEAD:fix/focus-gate-fallback-flow
