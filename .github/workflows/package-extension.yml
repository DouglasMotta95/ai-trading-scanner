name: package-extension

on:
  pull_request:
  push:
    branches:
      - fix/v01161-restore-top-license-clock
      - fix/v01210-operation-lock-results

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read extension version
        id: version
        run: |
          VERSION=$(node -e 'const fs=require("fs");process.stdout.write(JSON.parse(fs.readFileSync("manifest.json","utf8")).version)')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Prepare installable extension folder
        run: |
          rm -rf dist/ai-trading-scanner-extension
          mkdir -p dist/ai-trading-scanner-extension
          cp manifest.json dist/ai-trading-scanner-extension/manifest.json
          cp -R src dist/ai-trading-scanner-extension/src
          test -f dist/ai-trading-scanner-extension/manifest.json
          test -f dist/ai-trading-scanner-extension/src/background-entry.js
          node -e 'const fs=require("fs");const m=JSON.parse(fs.readFileSync("dist/ai-trading-scanner-extension/manifest.json","utf8"));if(!m.version||!m.side_panel?.default_path)process.exit(1)'
      - uses: actions/upload-artifact@v4
        with:
          name: ai-trading-scanner-v${{ steps.version.outputs.version }}-extension
          path: dist/ai-trading-scanner-extension/
          if-no-files-found: error
          retention-days: 30
      - name: Prepare complete project package without Git internals
        run: |
          rm -rf dist/ai-trading-scanner-full-source
          mkdir -p dist/ai-trading-scanner-full-source
          rsync -a --exclude='.git/' --exclude='node_modules/' --exclude='dist/' --exclude='*.zip' --exclude='20942.mp4' ./ dist/ai-trading-scanner-full-source/
          test -f dist/ai-trading-scanner-full-source/manifest.json
          test -f dist/ai-trading-scanner-full-source/src/background-entry.js
          test -f dist/ai-trading-scanner-full-source/backend/package.json
      - uses: actions/upload-artifact@v4
        with:
          name: ai-trading-scanner-v${{ steps.version.outputs.version }}-full-source
          path: dist/ai-trading-scanner-full-source/
          if-no-files-found: error
          retention-days: 30
