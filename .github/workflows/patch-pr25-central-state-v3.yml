name: Apply explicit scanner state queue migration v3

on:
  push:
    branches: [fix/atomic-focused-signal-state-v2]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/atomic-focused-signal-state-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply migration and update architecture assertions
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/patch-pr25-central-state.yml').read_text()
          marker = "      - name: Migrate every scannerState writer to the central queue\n        shell: python\n        run: |\n"
          tail = "      - name: Validate syntax\n"
          script = textwrap.dedent(workflow.split(marker, 1)[1].split(tail, 1)[0])
          script = script.replace(
              "out, count = re.subn(pattern, replacement, text, count=1, flags=re.S)",
              "out, count = re.subn(pattern, lambda _m: replacement, text, count=1, flags=re.S)"
          )
          exec(compile(script, 'scanner-state-migration.py', 'exec'), {})

          p = Path('test/license-background-stability.test.mjs')
          s = p.read_text()
          s = s.replace(
              "const block = between('if (becameConfirm)', 'next = telemetryState');",
              "const block = between('const next = await updateScannerState(async scannerState => {', 'if (processedSnapshot)');\n  assert.match(block, /if \\(becameConfirm\\)/);"
          )
          p.write_text(s)

          p = Path('test/real-flow-gating.test.mjs')
          s = p.read_text()
          s = s.replace(
              "assert.ok(apply.indexOf('!licenseActive(scannerState.license)') < apply.indexOf('processSnapshot(enriched, next)'));",
              "assert.ok(apply.indexOf('!licenseActive(scannerState.license)') < apply.indexOf('processSnapshot(enriched, candidate)'));\n  assert.match(apply, /updateScannerState\\(async scannerState =>/);"
          )
          s = s.replace(
              "assert.match(augment, /if \\(!licenseActive\\(scannerState\\) \\|\\| settings\\.runtimePaused\\) return;/);",
              "assert.match(augment, /if \\(settings\\.runtimePaused\\) return;/);\n  assert.match(augment, /updateScannerState\\(scannerState => \\{[\\s\\S]*?if \\(!licenseActive\\(scannerState\\)\\) return;/);"
          )
          p.write_text(s)
      - name: Validate syntax
        run: |
          node --check src/services/scanner-state-atomic.js
          node --check src/background-augment.js
          node --check src/background.js
      - name: Run full tests
        run: cd backend && npm test
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/scanner-state-atomic.js src/background-augment.js src/background.js test/atomic-focused-state.test.mjs test/license-background-stability.test.mjs test/real-flow-gating.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: serialize all scanner state writers through one queue"
          git push origin HEAD:fix/atomic-focused-signal-state-v2
