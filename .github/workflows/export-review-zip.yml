name: Export review ZIP
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e53211460ac6386da55ae0455290bc1a8c15f017
      - name: Package repository
        run: zip -r ai-trading-scanner-e532114-review.zip . -x '.git/*' 'ai-trading-scanner-e532114-review.zip'
      - name: Upload repository ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ai-trading-scanner-e532114-review
          path: ai-trading-scanner-e532114-review.zip
          if-no-files-found: error
