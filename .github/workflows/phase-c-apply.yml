name: Phase C apply
on:
  push:
    branches: [phase-c/feed-quality-floor]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-c/feed-quality-floor
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Phase C
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/background.js')
          s=p.read_text()
          old="""    candidate = merge(candidate, processSnapshot(enriched, candidate));\n    const processedCount = Math.max(0, Number(candidate.signal?.candleCount ?? candidate.candles?.length ?? 0));"""
          new="""    candidate = merge(candidate, processSnapshot(enriched, candidate));\n    const confirmationFeedQuality = feedQuality(candidate);\n    if (candidate.signal?.state === 'CONFIRM' && confirmationFeedQuality < 80) {\n      const reason = `Confirmação bloqueada: qualidade do feed ${Math.round(confirmationFeedQuality)}% abaixo do piso de 80%.`;\n      candidate = merge(candidate, {\n        signal: { ...candidate.signal, state: 'NO_TRADE', direction: null, diagnosis: 'WAIT', uiState: 'WAIT', provisional: true, hint: reason, reason },\n        diagnostics: { ...(candidate.diagnostics || {}), confirmationFeedGate: { allowed: false, quality: confirmationFeedQuality, minimum: 80, at: Date.now() } }\n      });\n    } else {\n      candidate = merge(candidate, { diagnostics: { ...(candidate.diagnostics || {}), confirmationFeedGate: { allowed: true, quality: confirmationFeedQuality, minimum: 80, at: Date.now() } } });\n    }\n    const processedCount = Math.max(0, Number(candidate.signal?.candleCount ?? candidate.candles?.length ?? 0));"""
          if old not in s: raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1))
          Path('test/feed-quality-floor.test.mjs').write_text("""import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport fs from 'node:fs';\nconst source=fs.readFileSync(new URL('../src/background.js',import.meta.url),'utf8');\ntest('Phase C requires feed quality of at least 80 for CONFIRM',()=>{ assert.match(source,/confirmationFeedQuality < 80/); assert.match(source,/minimum: 80/); });\n""")
          Path('.github/workflows/phase-c-apply.yml').unlink()
          PY
      - run: npm test
      - run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Phase C: enforce minimum feed quality for confirmations"
          git push origin HEAD:phase-c/feed-quality-floor
