name: Integrate demo candidate

on:
  push:
    branches: [release/demo-candidate-integrated-v3]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Integrate and validate demo candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ddea566c6a6db7fe0ba08d9a51a8bad89d6494ea
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/core/orchestrator.js')
          s = p.read_text()

          def replace_once(old, new):
              global s
              if old in s:
                  s = s.replace(old, new, 1)

          if "import { marketRegime } from './market-regime.js';" not in s:
              replace_once("import { analyzeCandles, ANALYST_THRESHOLDS } from './analysis.js';\n",
                           "import { analyzeCandles, ANALYST_THRESHOLDS } from './analysis.js';\nimport { marketRegime } from './market-regime.js';\n")

          replace_once("uiState = 'ANALYZING_MARKET', analytics = {}, waitingFor = null, stability = null",
                       "uiState = 'ANALYZING_MARKET', analytics = {}, waitingFor = null, regime = null, stability = null")
          replace_once("    analytics,\n    waitingFor,\n    stability,",
                       "    analytics,\n    waitingFor,\n    regime,\n    stability,")
          replace_once("  const liveResult = analyzeCandles(combined, indicatorHistory);\n  const candleCount = closed.length;",
                       "  const liveResult = analyzeCandles(combined, indicatorHistory);\n  const regime = marketRegime(closed);\n  const candleCount = closed.length;")
          replace_once("    waitingFor: liveResult.waitingFor || null,\n    stability: stabilitySnapshot(tracker),",
                       "    waitingFor: liveResult.waitingFor || null,\n    regime,\n    stability: stabilitySnapshot(tracker),")
          replace_once("  if (secondsRemaining <= 10) {\n    const canConfirm = observeConfirmation(tracker, liveResult, direction, score, sampleAt);",
                       "  if (secondsRemaining <= 10) {\n    const rangeBlocked = regime?.type === 'range';\n    if (rangeBlocked) {\n      tracker.confirmDirection = null;\n      tracker.confirmHits = 0;\n      tracker.lastConfirmAt = null;\n    }\n    const canConfirm = !rangeBlocked && observeConfirmation(tracker, liveResult, direction, score, sampleAt);")
          replace_once("    finalDecisions.set(key, {\n      bucket: currentBucket,\n      state: 'NO_TRADE',\n      direction: null,\n      provisional: false,\n      reason: liveResult.waitingFor?.text || 'Sem confirmação estável suficiente para liberar a próxima vela.',",
                       "    const noTradeReason = rangeBlocked\n      ? 'AGUARDANDO — mercado sem tendência definida.'\n      : (liveResult.waitingFor?.text || 'Sem confirmação estável suficiente para liberar a próxima vela.');\n    finalDecisions.set(key, {\n      bucket: currentBucket,\n      state: 'NO_TRADE',\n      direction: null,\n      provisional: false,\n      reason: noTradeReason,")
          replace_once("    });\n\n    if (possibleDirection) {",
                       "    });\n\n    if (rangeBlocked) {\n      return {\n        candles: closed,\n        currentCandle: current,\n        lastConfirmed,\n        signal: baseSignal({\n          ...common,\n          state: 'NO_TRADE',\n          direction: null,\n          provisional: false,\n          phase: 'FINAL',\n          uiState: 'WAIT',\n          reason: noTradeReason,\n          stability: stabilitySnapshot(tracker)\n        })\n      };\n    }\n\n    if (possibleDirection) {")
          replace_once("        reason: liveResult.waitingFor?.text || 'Sem padrão estável forte o suficiente para a próxima vela.',",
                       "        reason: noTradeReason,")

          required = [
              "import { marketRegime } from './market-regime.js';",
              "const regime = marketRegime(closed);",
              "const rangeBlocked = regime?.type === 'range';",
              "AGUARDANDO — mercado sem tendência definida.",
              "waitingFor: liveResult.waitingFor || null",
              "if (rangeBlocked) {\n      return {",
          ]
          for item in required:
              assert item in s, item
          p.write_text(s)
          PY

          if [ ! -f test/market-regime-gate.test.mjs ]; then
            git show ddea566c6a6db7fe0ba08d9a51a8bad89d6494ea:test/market-regime-gate.test.mjs > test/market-regime-gate.test.mjs
          fi

          cat > test/demo-candidate-integration.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';

          test('demo candidate keeps focus, waiting guidance and range gate together', async () => {
            const [orchestrator, focusedAsset, analysis] = await Promise.all([
              readFile(new URL('../src/core/orchestrator.js', import.meta.url), 'utf8'),
              readFile(new URL('../src/content/focused-asset.js', import.meta.url), 'utf8'),
              readFile(new URL('../src/core/analysis.js', import.meta.url), 'utf8')
            ]);
            assert.match(orchestrator, /marketRegime\(closed\)/);
            assert.match(orchestrator, /regime\?\.type === 'range'/);
            assert.match(orchestrator, /AGUARDANDO — mercado sem tendência definida/);
            assert.match(orchestrator, /waitingFor: liveResult\.waitingFor \|\| null/);
            assert.match(analysis, /waitingFor/);
            assert.match(focusedAsset, /user-selection/);
            assert.match(focusedAsset, /aria-selected/);
            assert.match(focusedAsset, /__ATS_FOCUSED_ASSET_VALUE__/);
          });
          EOF

          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          cd backend && npm test && cd ..

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/orchestrator.js test/market-regime-gate.test.mjs test/demo-candidate-integration.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "feat: integrate demo scanner candidate"
            git push origin HEAD:release/demo-candidate-integrated-v3
          fi
