name: Apply runtime acquisition and license recovery fix

on:
  push:
    branches: [fix/connect-casatrade-any-open-tab]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply runtime recovery fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          # Focus tracking must reach inherited-origin/opaque child frames.
          p = Path('manifest.json')
          manifest = json.loads(p.read_text())
          manifest['version'] = '0.10.4'
          focused = next((cs for cs in manifest.get('content_scripts', []) if cs.get('js') == ['src/content/focused-asset.js']), None)
          if focused is None:
              raise SystemExit('focused-asset content script not found')
          focused['all_frames'] = True
          focused['match_origin_as_fallback'] = True
          p.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n')

          # Direct fallback is injected only after the top-level tab is verified as CasaTrade,
          # therefore child about:/srcdoc frames must not be rejected by their own hostname.
          p = Path('src/background.js')
          text = p.read_text()
          text = text.replace(
              "{ file: 'src/content/focused-asset.js', world: 'ISOLATED', allFrames: false }",
              "{ file: 'src/content/focused-asset.js', world: 'ISOLATED', allFrames: true }",
              1
          )
          old_guard = """function scanCasaTradeFrame() {\n  const host = String(location.hostname || '').toLowerCase().replace(/\\.$/, '');\n  if (!(host === 'casatrade.com' || host.endsWith('.casatrade.com') || host === 'casatrade.io' || host.endsWith('.casatrade.io'))) return null;\n"""
          new_guard = """function scanCasaTradeFrame() {\n  // The target top-level tab is validated as CasaTrade before injection.\n  // Child frames may be about:blank/srcdoc and still contain the live Quetta market UI.\n"""
          if old_guard in text:
              text = text.replace(old_guard, new_guard, 1)
          elif 'Child frames may be about:blank/srcdoc' not in text:
              raise SystemExit('direct frame host guard not found')

          old_quality = """function feedQuality(state = {}) {\n  if (state.connection !== 'online' || state.price == null) return 0;\n  const reported = Number(state.diagnostics?.network?.feedQuality);\n  if (Number.isFinite(reported) && reported > 0) return Math.max(0, Math.min(100, reported));\n  if (state.capabilities?.structuredQuotes) return 100;\n  return state.asset && state.price != null ? 65 : 0;\n}\n"""
          new_quality = """function feedQuality(state = {}) {\n  if (state.connection !== 'online' || state.price == null) return 0;\n  const reported = Number(state.diagnostics?.network?.feedQuality);\n  if (Number.isFinite(reported) && reported > 0) return Math.max(0, Math.min(100, reported));\n  if (state.capabilities?.structuredQuotes) return 100;\n  if (state.asset && state.price != null && state.diagnostics?.directScan?.assetPriceCorroborated === true) return 85;\n  return state.asset && state.price != null ? 65 : 0;\n}\n"""
          if old_quality in text:
              text = text.replace(old_quality, new_quality, 1)
          elif 'assetPriceCorroborated === true) return 85' not in text:
              raise SystemExit('feed quality anchor not found')

          insertion = """    const assetSource = bestFocused ? 'focused-dom' : focus ? 'focused-screen' : best?.asset ? 'dom-fallback' : null;\n    const priceSource = best?.priceSource || (best?.buy != null || best?.sell != null ? 'buttons' : observedPrice != null ? 'chart' : null);\n    const directAssetPriceCorroborated = !!observedAsset && observedPrice != null && (\n      (!!focus && !!bestFocused && focusMeta?.reliable === true)\n      || (!focus && !!best?.asset && Number(best?.score || 0) >= 55)\n    );\n    const snapshot = {\n"""
          old_insertion = """    const assetSource = bestFocused ? 'focused-dom' : focus ? 'focused-screen' : best?.asset ? 'dom-fallback' : null;\n    const priceSource = best?.priceSource || (best?.buy != null || best?.sell != null ? 'buttons' : observedPrice != null ? 'chart' : null);\n    const snapshot = {\n"""
          if 'const directAssetPriceCorroborated' not in text:
              if old_insertion not in text:
                  raise SystemExit('direct corroboration insertion point not found')
              text = text.replace(old_insertion, insertion, 1)
          if 'assetPriceCorroborated: directAssetPriceCorroborated' not in text:
              marker = "          usedFocusFallback: !!focus && !bestFocused,\n          at: Date.now()"
              replacement = "          usedFocusFallback: !!focus && !bestFocused,\n          assetPriceCorroborated: directAssetPriceCorroborated,\n          at: Date.now()"
              if marker not in text:
                  raise SystemExit('direct diagnostics insertion point not found')
              text = text.replace(marker, replacement, 1)
          p.write_text(text)

          # Allow focused-asset evidence arriving from child frames of a validated CasaTrade tab.
          p = Path('src/background-augment.js')
          text = p.read_text()
          old = """async function setFocusedAsset(message = {}, sender = {}) {\n  const focused = normAsset(message.asset);\n  if (!focused || !sender?.tab?.id || sender.frameId !== 0) return;\n\n  let senderHost = '';\n  try { senderHost = new URL(sender.url || sender.tab.url || '').hostname; } catch {}\n  if (!isCasaTradeHost(senderHost)) return;\n"""
          new = """async function setFocusedAsset(message = {}, sender = {}) {\n  const focused = normAsset(message.asset);\n  if (!focused || !sender?.tab?.id) return;\n\n  let senderHost = '';\n  let topHost = '';\n  try { senderHost = new URL(sender.url || '').hostname; } catch {}\n  try { topHost = new URL(sender.tab.url || '').hostname; } catch {}\n  if (!isCasaTradeHost(topHost) && !isCasaTradeHost(senderHost)) return;\n"""
          if old in text:
              text = text.replace(old, new, 1)
          elif 'let topHost' not in text or 'sender.frameId !== 0' in text:
              raise SystemExit('focused child-frame gate anchor not found')
          p.write_text(text)

          # Network fallback may bootstrap the active pair from strong evidence when visual focus
          # has not arrived yet. If focus exists, it remains authoritative.
          p = Path('src/content/network-bridge.js')
          text = p.read_text()
          best_pattern = re.compile(r"  function bestCandidate\(payload = \{\}, preferredAsset = ''\) \{.*?\n  \}\n\n  function historyFor", re.S)
          best_replacement = """  function bestCandidate(payload = {}, preferredAsset = '') {\n    const wanted = assetBase(preferredAsset);\n    let rows = (Array.isArray(payload.candidates) ? payload.candidates : []).map(c => {\n      const asset = canonicalAsset(c?.asset);\n      const price = num(c?.price) ?? (num(c?.bid) != null && num(c?.ask) != null ? (num(c.bid) + num(c.ask)) / 2 : null);\n      return { ...c, asset, price };\n    }).filter(c => c.asset && c.price != null && c.price > 0 && (!wanted || sameAsset(c.asset, preferredAsset)));\n    rows.sort((a, b) =>\n      Number(b?.selected === true) - Number(a?.selected === true)\n      || Number(b?.confidence || 0) - Number(a?.confidence || 0)\n      || Number(b?.seenCount || 0) - Number(a?.seenCount || 0)\n      || Number(b?.observedAt || 0) - Number(a?.observedAt || 0)\n    );\n    if (wanted) return rows[0] || null;\n    return rows.find(c => c.selected === true || Number(c.confidence || 0) >= 82 || Number(c.seenCount || 0) >= 2) || null;\n  }\n\n  function historyFor"""
          text, n = best_pattern.subn(best_replacement, text, count=1)
          if n != 1:
              raise SystemExit('bestCandidate replacement failed')

          send_pattern = re.compile(r"  function sendSnapshot\(\{ asset, price, timeframe = 'M1'.*?\n  \}\n\n  function publishToExtension", re.S)
          send_replacement = """  function sendSnapshot({ asset, price, timeframe = 'M1', expiration = null, secondsRemaining = null, candles = [], source = 'market', feedQuality = 0, structured = false }) {\n    const focus = focusedAsset();\n    const cleanAsset = canonicalAsset(asset);\n    if (!cleanAsset || price == null) return;\n    if (focus && !sameAsset(cleanAsset, focus)) return;\n    const resolvedAsset = focus || cleanAsset;\n    chrome.runtime.sendMessage({\n      type: 'ATS_PLATFORM_SNAPSHOT',\n      payload: {\n        platformId: 'casatrade', platformName: 'CasaTrade', connection: 'online',\n        asset: resolvedAsset, price: Number(price), timeframe, analysisTimeframe: timeframe, expiration,\n        secondsRemaining: Number.isFinite(Number(secondsRemaining)) ? Number(secondsRemaining) : null,\n        instrumentType: 'unknown', marketType: /\\(OTC\\)/i.test(resolvedAsset) ? 'otc' : 'regular',\n        serverTime: null, candles: Array.isArray(candles) ? candles.slice(-120) : [],\n        ticks: [{ price: Number(price), at: Date.now() }],\n        capabilities: { structuredQuotes: !!structured, candles: Array.isArray(candles) && candles.length >= 3, expiration: !!expiration, multiAsset: false },\n        diagnostics: { capture: source, feedQuality: Number(feedQuality || 0), relayed: true, filteredTo: resolvedAsset, focusFallback: !focus }\n      }\n    }).catch(() => {});\n  }\n\n  function publishToExtension"""
          text, n = send_pattern.subn(send_replacement, text, count=1)
          if n != 1:
              raise SystemExit('sendSnapshot replacement failed')

          publish_pattern = re.compile(r"  function publishToExtension\(payload = \{\}\) \{.*?\n  \}\n\n  function deepText", re.S)
          publish_replacement = """  function publishToExtension(payload = {}) {\n    chrome.runtime.sendMessage({ type: 'ATS_NETWORK_DIAGNOSTIC', payload }).catch(() => {});\n    const focus = focusedAsset();\n    const candidate = bestCandidate(payload, focus);\n    if (!candidate) return;\n    if (focus && !sameAsset(candidate.asset, focus)) return;\n    const resolvedAsset = focus || candidate.asset;\n    const price = Number(candidate.price);\n    const networkHistory = historyFor(payload, resolvedAsset);\n    const timeframe = selectedTimeframeFromDom() || candidate.timeframe || networkHistory.at(-1)?.timeframe || 'M1';\n    const expiration = selectedExpirationFromDom() || candidate.expiration || null;\n    const secondsRemaining = countdownFromDom(timeframe);\n    const localHistory = updateLocalCandle(resolvedAsset, price, timeframe);\n    const candles = networkHistory.length >= 2 ? networkHistory : localHistory;\n    sendSnapshot({\n      asset: resolvedAsset, price, timeframe, expiration, secondsRemaining, candles,\n      source: `top-frame-relay:${candidate.transport || payload.primaryTransport || 'market'}`,\n      feedQuality: payload.feedQuality, structured: candidate.transport !== 'rendered'\n    });\n  }\n\n  function deepText"""
          text, n = publish_pattern.subn(publish_replacement, text, count=1)
          if n != 1:
              raise SystemExit('publishToExtension replacement failed')
          p.write_text(text)

          # Account refresh must never erase the saved license key when the server omits licenseKey.
          p = Path('src/sidepanel/account-login.js')
          text = p.read_text()
          old = """  async function saveSession(r) {\n    const values = {\n      [LICENSE_KEY]: String(r.licenseKey || ''),\n      [CLIENT_TOKEN_KEY]: String(r.clientToken || ''),\n      [CLIENT_EXP_KEY]: Number(r.clientTokenExpiresAt) || 0,\n      [ACCOUNT_TOKEN_KEY]: String(r.accountToken || ''),\n      [ACCOUNT_EXP_KEY]: Number(r.accountTokenExpiresAt) || 0\n    };\n"""
          new = """  async function saveSession(r) {\n    const previous = await chrome.storage.local.get(LICENSE_KEY);\n    const resolvedLicenseKey = String(r.licenseKey || r.license?.key || previous[LICENSE_KEY] || '').trim();\n    const values = {\n      ...(resolvedLicenseKey ? { [LICENSE_KEY]: resolvedLicenseKey } : {}),\n      [CLIENT_TOKEN_KEY]: String(r.clientToken || ''),\n      [CLIENT_EXP_KEY]: Number(r.clientTokenExpiresAt) || 0,\n      [ACCOUNT_TOKEN_KEY]: String(r.accountToken || ''),\n      [ACCOUNT_EXP_KEY]: Number(r.accountTokenExpiresAt) || 0\n    };\n"""
          if old in text:
              text = text.replace(old, new, 1)
              text = text.replace("licenseKey: String(r.licenseKey || r.license?.key || ''),", "licenseKey: resolvedLicenseKey,", 1)
          elif 'const resolvedLicenseKey' not in text:
              raise SystemExit('account saveSession anchor not found')
          p.write_text(text)
          PY

          cat > test/runtime-recovery-regression.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const read = path => fs.readFileSync(new URL(`../${path}`, import.meta.url), 'utf8');

          test('focused asset and direct scan reach inherited-origin child frames', () => {
            const manifest = JSON.parse(read('manifest.json'));
            const row = manifest.content_scripts.find(x => x.js?.length === 1 && x.js[0] === 'src/content/focused-asset.js');
            const background = read('src/background.js');
            const augment = read('src/background-augment.js');
            assert.equal(row?.all_frames, true);
            assert.equal(row?.match_origin_as_fallback, true);
            assert.match(background, /focused-asset\.js'.*allFrames: true/);
            assert.match(background, /Child frames may be about:blank\/srcdoc/);
            assert.doesNotMatch(augment, /sender\.frameId !== 0/);
            assert.match(augment, /isCasaTradeHost\(topHost\)/);
          });

          test('strong network evidence can bootstrap asset before focus without overriding a real focus', () => {
            const bridge = read('src/content/network-bridge.js');
            assert.match(bridge, /confidence \|\| 0\) >= 82/);
            assert.match(bridge, /const resolvedAsset = focus \|\| candidate\.asset/);
            assert.match(bridge, /if \(focus && !sameAsset\(candidate\.asset, focus\)\) return/);
            assert.match(bridge, /focusFallback: !focus/);
          });

          test('corroborated DOM evidence can clear the Phase C floor while weak DOM remains below it', () => {
            const background = read('src/background.js');
            assert.match(background, /assetPriceCorroborated === true\) return 85/);
            assert.match(background, /return state\.asset && state\.price != null \? 65 : 0/);
            assert.match(background, /confirmationFeedQuality < 80/);
          });

          test('account refresh preserves prior non-empty license key and stable runtime identity remains intact', () => {
            const account = read('src/sidepanel/account-login.js');
            const telemetry = read('src/services/telemetry.js');
            assert.match(account, /previous\[LICENSE_KEY\]/);
            assert.match(account, /resolvedLicenseKey/);
            assert.match(telemetry, /stableRuntimeInstallationId/);
            assert.match(telemetry, /const id = stableId \|\| existing \|\| randomInstallationId\(\)/);
          });
          EOF

      - name: Syntax checks
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          find backend -name '*.js' -print0 | xargs -0 -n1 node --check
          find apps -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check test/runtime-recovery-regression.test.mjs
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"

      - name: Full tests
        run: cd backend && npm test

      - name: Build installable extension ZIP
        run: |
          rm -rf build-extension
          mkdir build-extension
          cp manifest.json build-extension/manifest.json
          cp -R src build-extension/src
          cd build-extension
          zip -qr ../AI-Trading-Scanner-0.10.4-RUNTIME-RECOVERY.zip manifest.json src

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Trading-Scanner-0.10.4-RUNTIME-RECOVERY
          path: AI-Trading-Scanner-0.10.4-RUNTIME-RECOVERY.zip
          if-no-files-found: error
          retention-days: 30

      - name: Commit validated patch and clean helper workflows
        run: |
          rm -f .github/workflows/apply-runtime-recovery-fix.yml
          rm -f .github/workflows/run-runtime-recovery-fix.yml
          rm -f scripts/apply-runtime-recovery-fix.py scripts/post-runtime-recovery-fix.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: recover CasaTrade cross-frame market acquisition'
          git push origin HEAD:fix/connect-casatrade-any-open-tab
