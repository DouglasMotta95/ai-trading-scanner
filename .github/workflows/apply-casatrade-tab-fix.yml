name: Apply CasaTrade tab discovery fix

on:
  push:
    branches: [fix/connect-casatrade-any-open-tab]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch background tab discovery
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/background.js')
          text = p.read_text()
          import_old = "import { detectPlatform } from './platforms/registry.js';\n"
          import_new = import_old + "import { findCasaTradeTab } from './services/casatrade-tab-selection.js';\n"
          if import_new not in text:
              if import_old not in text:
                  raise SystemExit('registry import anchor not found')
              text = text.replace(import_old, import_new, 1)
          old = """async function activeCasaTradeTab() {\n  const [tab] = await chrome.tabs.query({ active: true, currentWindow: true });\n  if (!tab?.id || !tab.url) return { tab: null, platform: null };\n  return { tab, platform: platformFromUrl(tab.url) };\n}\n"""
          new = """async function activeCasaTradeTab() {\n  return findCasaTradeTab();\n}\n"""
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('activeCasaTradeTab anchor not found')
          p.write_text(text)
          PY
      - name: Syntax check
        run: |
          node --check src/background.js
          node --check src/services/casatrade-tab-selection.js
          node --check test/casatrade-tab-selection.test.mjs
      - name: Full unit tests
        run: cd backend && npm test
      - name: Commit patch and remove helper workflow
        run: |
          rm .github/workflows/apply-casatrade-tab-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/background.js src/services/casatrade-tab-selection.js test/casatrade-tab-selection.test.mjs .github/workflows/apply-casatrade-tab-fix.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: connect to any open CasaTrade tab'
          git push origin HEAD:fix/connect-casatrade-any-open-tab
