name: Package 0.10.3
on:
  workflow_dispatch:
  pull_request:
    branches: [fix/video-root-causes-pr32]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate manifest
        run: node -e "const m=JSON.parse(require('fs').readFileSync('manifest.json','utf8')); if(m.manifest_version!==3) process.exit(1); if(m.version!=='0.10.3') process.exit(2); console.log('manifest',m.version,'ok')"
      - name: Syntax check extension
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Core unit tests
        run: cd backend && npm test
      - name: Package extension
        run: zip -r AI-Trading-Scanner-0.10.3.zip manifest.json src -x '*.DS_Store'
      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Trading-Scanner-0.10.3
          path: AI-Trading-Scanner-0.10.3.zip
