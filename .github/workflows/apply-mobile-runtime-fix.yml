name: Apply mobile runtime fix

on:
  push:
    branches:
      - release/demo-candidate-integrated-v3

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Quetta/mobile compatibility patch
        run: |
          python3 .github/scripts/fix-mobile-runtime.py
          python3 .github/scripts/update-mobile-regressions.py
      - name: Validate extension and tests
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          node --test test/mobile-browser-compat.test.mjs
          cd backend
          npm test
          cd ..
      - name: Commit functional changes and remove temporary helpers
        run: |
          rm -f .github/scripts/fix-mobile-runtime.py .github/scripts/update-mobile-regressions.py .github/workflows/apply-mobile-runtime-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: support mobile extension runtime and sticky asset focus"
          git push origin HEAD:release/demo-candidate-integrated-v3
