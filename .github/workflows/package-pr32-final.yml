name: Package PR32 final test build

on:
  push:
    branches:
      - artifact/pr32-final-7aeb

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact immutable archive
        run: |
          TARGET_SHA=7aeb5e9bec112cc684c412bd6e64d0dfb85d5884
          SHORT_SHA=${TARGET_SHA:0:7}
          git archive --format=zip --output="AI-Trading-Scanner-Quetta-CasaTrade-${SHORT_SHA}.zip" --prefix="ai-trading-scanner-${SHORT_SHA}/" "$TARGET_SHA"
          unzip -t "AI-Trading-Scanner-Quetta-CasaTrade-${SHORT_SHA}.zip"
          sha256sum "AI-Trading-Scanner-Quetta-CasaTrade-${SHORT_SHA}.zip" > "AI-Trading-Scanner-Quetta-CasaTrade-${SHORT_SHA}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Trading-Scanner-Quetta-CasaTrade-7aeb5e9
          path: |
            AI-Trading-Scanner-Quetta-CasaTrade-7aeb5e9.zip
            AI-Trading-Scanner-Quetta-CasaTrade-7aeb5e9.sha256
          if-no-files-found: error
