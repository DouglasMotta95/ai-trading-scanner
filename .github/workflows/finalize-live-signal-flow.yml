name: Finalize live signal flow

on:
  push:
    branches:
      - release/demo-candidate-integrated-v3

permissions:
  contents: write

jobs:
  apply-test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply live signal fixes
        run: python3 .github/scripts/finalize-live-signal-flow.py
      - name: Syntax check
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Full test suite
        run: |
          cd backend
          npm test
          cd ..
      - name: Build installable ZIP
        run: |
          rm -rf /tmp/ats-live-final
          mkdir -p /tmp/ats-live-final
          rsync -a --exclude='.git' --exclude='.github' --exclude='backend/data' ./ /tmp/ats-live-final/
          cd /tmp
          zip -qr "$GITHUB_WORKSPACE/AI-Trading-Scanner-CasaTrade-FINAL.zip" ats-live-final
          unzip -t "$GITHUB_WORKSPACE/AI-Trading-Scanner-CasaTrade-FINAL.zip"
          sha256sum "$GITHUB_WORKSPACE/AI-Trading-Scanner-CasaTrade-FINAL.zip" > "$GITHUB_WORKSPACE/AI-Trading-Scanner-CasaTrade-FINAL.sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Trading-Scanner-CasaTrade-FINAL
          path: |
            AI-Trading-Scanner-CasaTrade-FINAL.zip
            AI-Trading-Scanner-CasaTrade-FINAL.sha256.txt
          retention-days: 7
      - name: Commit only functional changes
        run: |
          rm -f .github/scripts/finalize-live-signal-flow.py .github/workflows/finalize-live-signal-flow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make live signals responsive and overlay diagnostic"
          git push origin HEAD:release/demo-candidate-integrated-v3
